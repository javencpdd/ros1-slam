# NavfnROS global planner candidate, swapped by local/global planner launch args.
# Stock ROS1 navfn parameters; no new physical threshold is introduced.
NavfnROS:
  allow_unknown: false
  default_tolerance: 0.0
  visualize_potential: false
  use_dijkstra: true
  use_quadratic: false
  use_grid_path: false
  old_navfn_behavior: false
