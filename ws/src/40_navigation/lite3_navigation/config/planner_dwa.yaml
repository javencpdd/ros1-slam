# DWA local planner candidate, swapped by navigation_executor.launch local_planner:=dwa.
# Stock ROS1 DWA parameters; footprint/velocity/acceleration/goal tolerances are copied
# from the existing TEB config so the comparison changes the algorithm, not the robot limits.
DWAPlannerROS:
  acc_lim_x: 1.0
  acc_lim_y: 0.1
  acc_lim_theta: 1.0
  max_vel_trans: 1.0
  min_vel_trans: 0.05
  max_vel_x: 0.4
  min_vel_x: 0.0
  max_vel_y: 0.1
  min_vel_y: 0.0
  max_vel_theta: 1.0
  min_vel_theta: 0.1
  min_in_place_vel_theta: 0.2
  escape_vel: -0.1
  holonomic_robot: true
  yaw_goal_tolerance: 0.20
  xy_goal_tolerance: 0.20
  latch_xy_goal_tolerance: false
  sim_time: 1.7
  vx_samples: 20
  vy_samples: 5
  vth_samples: 40
  controller_frequency: 10.0
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.02
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  oscillation_reset_dist: 0.05
  publish_traj_pc: false
  publish_cost_grid_pc: false
  global_frame_id: map
