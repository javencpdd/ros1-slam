# previous hard-coded launch defaults, so switching to this file changes nothing.
# Keys here must stay a subset of what bt_console.cpp reads via pnh.param();
# test_bt_config.py enforces yaml_keys + launch param keys == code keys.
goal_topic: /v8/bt/goal
