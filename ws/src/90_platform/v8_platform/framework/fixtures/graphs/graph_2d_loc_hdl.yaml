schema: pipeline_graph/v1
name: nav2d_loc_hdl
instances:
  - {id: sensors, component: v8.fw.sensors}
  - {id: loc, component: v8.fw.hdl_localization}
  - {id: map, component: v8.fw.map2d}
  - {id: global, component: v8.fw.global2d}
  - {id: local, component: v8.fw.local2d}
  - {id: mux, component: v8.fw.mux, params: {default_priority: navigation}}
  - {id: robot, component: v8.fw.robot_lite3}
edges:
  - {from: sensors.points, to: loc.points}
  - {from: sensors.imu, to: loc.imu}
  - {from: loc.odom, to: global.odom}
  - {from: loc.odom, to: local.odom}
  - {from: map.map, to: global.map}
  - {from: map.map, to: local.map}
  - {from: global.path, to: local.path}
  - {from: local.cmd, to: mux.cmd}
  - {from: mux.cmd, to: robot.cmd}
external:
  - {to: global.goal, type: geometry_msgs/PoseStamped, source: operator}
  - {to: mux.hold, type: std_msgs/Bool, source: supervisor}
