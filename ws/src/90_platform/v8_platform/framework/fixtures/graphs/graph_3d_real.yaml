schema: pipeline_graph/v1
name: nav3d_real_chain
instances:
  - id: cache_a
    component: v8.fw.map_cache_ros
    namespace: /v8/3d/cache_a
    params:
      map_id: two_level_boxes
      base_version: 2
      base_map_topic: /v8/3d/base_a
      delta_topic: /v8/3d/delta_a
      status_topic: /v8/3d/cache_a/status
  - id: cache_b
    component: v8.fw.map_cache_ros
    namespace: /v8/3d/cache_b
    params:
      map_id: two_level_boxes
      base_version: 2
      base_map_topic: /v8/3d/base_b
      delta_topic: /v8/3d/delta_b
      status_topic: /v8/3d/cache_b/status
  - id: merge
    component: v8.fw.map_merge_ros
    namespace: /v8/3d/merge
    params:
      delta_a: /v8/3d/delta_a
      delta_b: /v8/3d/delta_b
      delta_topic: /v8/3d/merged
      status_topic: /v8/3d/merge/status
  - id: relay
    component: v8.fw.map_delta_relay
    namespace: /v8/3d/relay
    params:
      delta_topic: /v8/3d/merged
      json_topic: /map_delta
  - id: provider
    component: v8.fw.delta_map_provider
    namespace: /v8/3d/provider
    params:
      map_json: contracts/fixtures/map_ml_two_surfaces.json
      state_path: /tmp/r1040_state.json
      delta_topic: /map_delta
      map_topic: /v8_support_map
      status_topic: /v8_map_status
  - id: global
    component: v8.fw.global3d_topic
    namespace: /v8/3d/global
    params:
      map_topic: /v8_support_map
      start_topic: /v8/3d/global/start
      goal_topic: /v8/3d/global/goal
      path_topic: /v8/3d/global/path
      status_topic: /v8/3d/global/status
  - id: path_goal
    component: v8.fw.path_goal3d
    namespace: /v8/3d/path_goal
    params:
      path_topic: /v8/3d/global/path
      goal_topic: /v8/local/goal
      status_topic: /v8/3d/path_goal/status
  - id: local
    component: v8.fw.local_native
    namespace: /v8/3d/local
    config: ../configs/local_native.yaml
  - id: mux3d
    component: v8.fw.cmd3d_mux
    namespace: /v8/3d/mux
    params:
      cmd_topic: /v8/local/cmd_vel_3d
      hold_topic: /lite3/supervisor/hold
      output_topic: /cmd_vel
      status_topic: /v8/3d/mux/status
      timeout_s: 0.4
  - id: carrier
    component: v8.fw.carrier3d
    namespace: /v8/3d/carrier
    params:
      start_x: 3.0
      start_y: 2.0
      start_z: 0.6
      yaw: 0.0
      rate_hz: 50.0
      cmd_topic: /cmd_vel
      pose_topic: /v8/local/pose
      localization_topic: /v8/local/localization_ok
      status_topic: /v8/3d/carrier/status
edges:
  - {from: cache_a.delta, to: merge.delta_a}
  - {from: cache_b.delta, to: merge.delta_b}
  - {from: merge.delta, to: relay.delta}
  - {from: relay.json, to: provider.delta}
  - {from: provider.map, to: global.map}
  - {from: provider.map, to: local.map}
  - {from: global.path, to: path_goal.path}
  - {from: path_goal.goal, to: local.goal}
  - {from: carrier.pose, to: local.pose, feedback: true,
     policy: {period_s: 0.05, max_age_s: 1.0}}
  - {from: carrier.localization, to: local.localization, feedback: true,
     policy: {period_s: 0.05, max_age_s: 1.0}}
  - {from: local.cmd, to: mux3d.cmd}
  - {from: mux3d.cmd, to: carrier.cmd}
external:
  - {to: cache_a.base_map, type: v8_msgs/SupportMap, source: map_provider}
  - {to: cache_b.base_map, type: v8_msgs/SupportMap, source: map_provider}
  - {to: global.start, type: geometry_msgs/PoseStamped, source: localization}
  - {to: global.goal, type: geometry_msgs/PoseStamped, source: operator}
  - {to: local.obstacles, type: std_msgs/String, source: perception}
  - {to: mux3d.hold, type: std_msgs/Bool, source: supervisor}
