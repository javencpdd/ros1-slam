experimental_config:
  resolution: 0.30
  # tick_s 是"检查新鲜度"的周期，不只影响规划频率：定位中断后，local 最坏要等一个
# tick 才发现输入过期。原来 1.20 s 这一项就是失效延迟的主因（实测 1.518 s ≈ 0.7+1.2 分量的叠加）。
# 0.40 s 把这段压到 0.4；max_step_m 同步从 0.30 收到 0.20，保证 0.20/0.40 = 0.5 m/s
# 不超 max_speed_mps 0.6，不改变单步速度上限。
  tick_s: 0.40
  horizon_s: 6.0
  validity_s: 20.0
  max_speed_mps: 0.6
  max_step_m: 0.20
  max_slope_deg: 35.0
  radius_m: 0.15
  height_m: 0.35
  clearance_m: 0.10
  goal_tolerance_m: 0.15
# 0.7 s 由实测确定，不是随手调小：/hdl_odom 实测 4.16 Hz、间隔 p99 472 ms、max 544 ms
# （scripts/verify/topic_interval.py），0.7 s 覆盖最长空档并留 156 ms 余量。
# 原先的 1.0 s 会让定位中断后多放行约 0.3 s 的运动。
input_max_age_s: 0.7
wall_watchdog_s: 90.0
map_topic: /v8_support_map
pose_topic: /v8/local/pose
goal_topic: /v8/local/goal
obstacles_topic: /v8/local/obstacles
localization_topic: /v8/local/localization_ok
command_topic: /v8/local/cmd_vel_3d
trajectory_topic: /v8/local/trajectory
status_topic: /v8/local/status
