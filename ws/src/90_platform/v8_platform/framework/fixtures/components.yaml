# Component catalog v0 — test doubles except where a real ROS1 package is named.
# A component declares launch identity, ports and (for outputs) an optional command topic.
schema: component_catalog/v1
components:
  - id: sensors
    launch: {package: lite3_drivers, type: sim_adapter}
    roles: [sensor_source]
    outputs:
      - {name: points, type: sensor_msgs/PointCloud2, topic: /rslidar_points}
      - {name: imu, type: sensor_msgs/Imu, topic: /livox/imu}

  - id: faster_lio
    launch: {package: faster_lio, type: run_mapping_online}
    roles: [odometry, mapping]
    inputs:
      - {name: points, type: sensor_msgs/PointCloud2, topic: /rslidar_points}
      - {name: imu, type: sensor_msgs/Imu, topic: /livox/imu}
    outputs:
      - {name: odom, type: nav_msgs/Odometry, topic: /Odometry}
      - {name: cloud, type: sensor_msgs/PointCloud2, topic: /cloud_registered}

  - id: map2d
    launch: {package: map_server, type: map_server}
    roles: [map_server]
    outputs:
      - {name: map, type: nav_msgs/OccupancyGrid, schema: occupancy_grid/v1, topic: /map}

  - id: global2d
    launch: {package: global_planner, type: global_planner}
    roles: [global_planner]
    inputs:
      - {name: map, type: nav_msgs/OccupancyGrid, schema: occupancy_grid/v1, topic: /map}
      - {name: odom, type: nav_msgs/Odometry, topic: /Odometry}
      - {name: goal, type: geometry_msgs/PoseStamped, topic: /move_base_simple/goal}
    outputs:
      - {name: path, type: nav_msgs/Path, topic: /global_path}

  - id: local2d
    launch: {package: teb_local_planner, type: teb_local_planner}
    roles: [local_planner, controller]
    inputs:
      - {name: path, type: nav_msgs/Path, topic: /global_path}
      - {name: map, type: nav_msgs/OccupancyGrid, schema: occupancy_grid/v1, topic: /map}
      - {name: odom, type: nav_msgs/Odometry, topic: /Odometry}
    outputs:
      - {name: cmd, type: geometry_msgs/TwistStamped, topic: /cmd_vel_advice/local,
         command_topic: /cmd_vel_advice/local}

  - id: mux
    launch: {package: lite3_safety, type: safe_cmd_vel_mux.py}
    roles: [safety_arbiter]
    inputs:
      - {name: cmd, type: geometry_msgs/TwistStamped, topic: /cmd_vel_advice/local}
      - {name: hold, type: std_msgs/Bool, required: false, topic: /lite3/supervisor/hold}
    outputs:
      - {name: cmd, type: geometry_msgs/TwistStamped, topic: /cmd_vel, command_topic: /cmd_vel}

  - id: robot_lite3
    launch: {package: message_transformer, type: ros2qnx}
    roles: [robot_adapter]
    inputs:
      - {name: cmd, type: geometry_msgs/TwistStamped, topic: /cmd_vel}
    outputs:
      - {name: odom, type: nav_msgs/Odometry, topic: /odom}

  - id: map3d
    launch: {package: v8_platform, type: map3d_test_double}
    roles: [representation]
    inputs:
      - {name: cloud, type: sensor_msgs/PointCloud2, topic: /cloud_registered}
      - {name: delta, type: v8_msgs/MapDelta, schema: support_map_delta/v1, topic: /map_delta}
    outputs:
      - {name: map, type: v8_msgs/SupportMap, schema: support_map/v1, topic: /v8_support_map}

  - id: map_cache
    launch: {package: v8_platform, type: map_cache_test_double}
    roles: [map_cache]
    inputs:
      - {name: observations, type: sensor_msgs/PointCloud2, topic: /cloud_registered}
      - {name: odom, type: nav_msgs/Odometry, topic: /Odometry}
      - {name: base_map, type: v8_msgs/SupportMap, schema: support_map/v1, topic: /v8_support_map}
    outputs:
      - {name: delta, type: v8_msgs/MapDelta, schema: support_map_delta/v1, topic: /map_delta}
      - {name: cache, type: v8_msgs/SupportMap, schema: support_map/v1, topic: /cache_map}

  - id: map_merge
    launch: {package: v8_platform, type: map_merge_test_double}
    roles: [map_merge]
    inputs:
      - {name: delta_a, type: v8_msgs/MapDelta, schema: support_map_delta/v1}
      - {name: delta_b, type: v8_msgs/MapDelta, schema: support_map_delta/v1}
    outputs:
      - {name: delta, type: v8_msgs/MapDelta, schema: support_map_delta/v1, topic: /map_delta}

  - id: global3d
    launch: {package: v8_platform, type: global3d_test_double}
    roles: [global_planner]
    inputs:
      - {name: map, type: v8_msgs/SupportMap, schema: support_map/v1, topic: /v8_support_map}
      - {name: odom, type: nav_msgs/Odometry, topic: /Odometry}
      - {name: goal, type: geometry_msgs/PoseStamped, topic: /move_base_simple/goal}
    outputs:
      - {name: path, type: nav_msgs/Path, topic: /global_path}

  - id: local3d
    launch: {package: v8_platform, type: local3d_test_double}
    roles: [local_planner, controller]
    inputs:
      - {name: path, type: nav_msgs/Path, topic: /global_path}
      - {name: map, type: v8_msgs/SupportMap, schema: support_map/v1, topic: /v8_support_map}
      - {name: odom, type: nav_msgs/Odometry, topic: /Odometry}
    outputs:
      - {name: cmd, type: geometry_msgs/TwistStamped, topic: /cmd_vel_advice/3d,
         command_topic: /cmd_vel_advice/3d}

  - id: map3d_v2
    launch: {package: v8_platform, type: map3d_v2_test_double}
    roles: [representation]
    inputs:
      - {name: cloud, type: sensor_msgs/PointCloud2, topic: /cloud_registered}
    outputs:
      - {name: map, type: v8_msgs/SupportMap, schema: support_map/v2, topic: /v8_support_map}
