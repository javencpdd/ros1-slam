{
  "schema": "pipeline_graph/v1",
  "name": "two_floor_nav_bt",
  "execution_mode": "simulation",
  "robot_id": "generic_sim",
  "instances": [
    {
      "id": "map",
      "component": "v8.fw.map_file",
      "namespace": "/v8/3d/map",
      "params": {
        "map_json": "sim_ws/src/lite3_gazebo_sim/scenarios/two_floor_nav/maps/open.json",
        "map_topic": "/v8_support_map",
        "status_topic": "/v8_map_status"
      }
    },
    {
      "id": "global",
      "component": "v8.fw.global3d_topic",
      "namespace": "/v8/3d/global",
      "params": {
        "budget": 50000,
        "goal_topic": "/v8/3d/global/goal",
        "map_topic": "/v8_support_map",
        "min_clearance_m": 0.55,
        "path_topic": "/v8/3d/global/path",
        "robot_height_m": 0.5,
        "robot_radius_m": 0.35,
        "start_topic": "/v8/3d/global/start",
        "status_topic": "/v8/3d/global/status"
      }
    },
    {
      "id": "bt",
      "component": "v8.fw.bt_console",
      "namespace": "/v8/bt",
      "params": {
        "tree_file": "ws/src/90_platform/lite3_bt/trees/navigate_with_planner.xml",
        "goal_topic": "/v8/bt/goal",
        "pose_topic": "/v8/local/pose",
        "planner_goal_topic": "/v8/3d/global/goal",
        "path_topic": "/v8/3d/global/path",
        "path_status_topic": "/v8/3d/global/status",
        "out_goal_topic": "/v8/local/goal",
        "stop_topic": "/lite3/teleop/app_cmd_vel",
        "cancel_input_topic": "/v8/bt/cancel",
        "cancel_topic": "/v8/local/cancel",
        "cancel_ack_topic": "/v8/local/cancel_ack",
        "policy_topic": "/v8/bt/goal_policy",
        "mission_topic": "/v8/bt/goal_mission",
        "localization_topic": "/v8/local/localization_ok",
        "cancel_ack_timeout": 2.0,
        "recovery_mode": "skip",
        "retry_max": 1,
        "retry_delay_s": 0.0
      }
    },
    {
      "id": "local",
      "component": "v8.fw.local_native",
      "namespace": "/v8/3d/local",
      "config": "../configs/local.yaml",
      "params": {
        "cancel_topic": "/v8/local/cancel",
        "cancel_ack_topic": "/v8/local/cancel_ack"
      }
    },
    {
      "id": "mux3d",
      "component": "v8.fw.cmd3d_mux",
      "namespace": "/v8/3d/mux",
      "params": {
        "cmd_topic": "/v8/local/cmd_vel_3d",
        "hold_topic": "/lite3/supervisor/hold",
        "output_topic": "/cmd_vel",
        "status_topic": "/v8/3d/mux/status",
        "timeout_s": 0.4
      }
    },
    {
      "id": "carrier",
      "component": "v8.fw.gazebo_carrier3d",
      "namespace": "/v8/3d/carrier",
      "params": {
        "center_z": 0.3,
        "cmd_topic": "/cmd_vel",
        "localization_topic": "/v8/local/localization_ok",
        "map_topic": "/v8_support_map",
        "model_name": "app_carrier",
        "pose_topic": "/v8/local/pose",
        "rate_hz": 50.0,
        "snap_m": 0.03,
        "spawn": true,
        "start_x": 5.0,
        "start_y": 1.0,
        "start_z": 0.0,
        "status_topic": "/v8/3d/carrier/status"
      }
    }
  ],
  "edges": [
    {"from": "map.map", "to": "global.map"},
    {"from": "map.map", "to": "local.map"},
    {"from": "map.map", "to": "carrier.map"},
    {"from": "global.path", "to": "bt.path"},
    {"from": "global.status", "to": "bt.path_status"},
    {"from": "carrier.pose", "to": "bt.pose", "feedback": true,
     "policy": {"period_s": 0.05, "max_age_s": 1.0}},
    {"from": "bt.planner_goal", "to": "global.goal", "feedback": true,
     "policy": {"period_s": 0.10, "max_age_s": 2.0}},
    {"from": "bt.out_goal", "to": "local.goal"},
    {"from": "carrier.pose", "to": "local.pose", "feedback": true,
     "policy": {"period_s": 0.05, "max_age_s": 1.0}},
    {"from": "carrier.localization", "to": "local.localization", "feedback": true,
     "policy": {"period_s": 0.05, "max_age_s": 1.0}},
    {"from": "local.cmd", "to": "mux3d.cmd"},
    {"from": "mux3d.cmd", "to": "carrier.cmd"},
    {"from": "bt.cancel_cmd", "to": "local.cancel"},
    {"from": "local.cancel_ack", "to": "bt.cancel_ack", "feedback": true,
     "policy": {"period_s": 0.0, "max_age_s": 1.0}},
    {"from": "carrier.localization", "to": "bt.localization_ok", "feedback": true,
     "policy": {"period_s": 0.05, "max_age_s": 1.0}}
  ],
  "external": [
    {"to": "global.start", "type": "geometry_msgs/PoseStamped", "source": "operator"},
    {"to": "bt.goal", "type": "geometry_msgs/PoseStamped", "source": "operator"},
    {"to": "local.obstacles", "type": "std_msgs/String", "source": "perception"},
    {"to": "mux3d.hold", "type": "std_msgs/Bool", "source": "supervisor"},
    {"to": "bt.cancel", "type": "std_msgs/String", "source": "operator"},
    {"to": "bt.goal_policy", "type": "std_msgs/String", "source": "operator"},
    {"to": "bt.mission_goal", "type": "std_msgs/String", "source": "operator"}
  ]
}
